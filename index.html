function storesCollection(){ return db.collection('stores'); }
function watchStores(onData, onError){
  return storesCollection().onSnapshot(snap=>{
    const list = [];
    snap.forEach(doc=>list.push({ id: doc.id, name: (doc.data()||{}).name || '' }));
    list.sort((a,b)=>a.name.localeCompare(b.name));
    onData(list);
  }, onError);
}
function createStoreDoc(id, name){
  return storesCollection().doc(id).set({ name, meta: DEFAULT_META, pinterest: DEFAULT_PIN, orders: DEFAULT_ORDERS });
}
function deleteStoreDoc(id){ return storesCollection().doc(id).delete(); }
function watchStoreData(id, onData, onError){
  return storesCollection().doc(id).onSnapshot(snap=>{
    if (snap.exists) onData(snap.data());
  }, onError);
}
function updateStoreField(id, field, value){
  return storesCollection().doc(id).set({ [field]: value }, { merge: true });
}

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function toNum(v){ if (typeof v === 'number') return isFinite(v) ? v : 0; if (v===undefined||v===null||v==='') return 0; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; }
function fmtEur(n,d=2){ n = toNum(n); const s=Math.abs(n).toLocaleString('cs-CZ',{minimumFractionDigits:d,maximumFractionDigits:d}); return (n<0?'-':'')+'€'+s; }
function fmtKc(n,d=2){ n = toNum(n); const s=n.toLocaleString('cs-CZ',{minimumFractionDigits:d,maximumFractionDigits:d}); return s+' Kč'; }
function fmtPct(n,d=1){ n = toNum(n); return n.toLocaleString('cs-CZ',{minimumFractionDigits:d,maximumFractionDigits:d})+'%'; }
function fmtNum(n,d=0){ n = toNum(n); return n.toLocaleString('cs-CZ',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

const storage = {
  get(key){ try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch(e){ return false; } },
  remove(key){ try { localStorage.removeItem(key); } catch(e){} }
};

// IndexedDB for invoice PDFs (holds much more data than localStorage)
const IDB_NAME = 'profitomat-files';
const IDB_STORE = 'invoices';
function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbAdd(record){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).add(record);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGetAll(){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function idbDelete(id){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

// ---------- SHARED: profit trend chart (bar chart, colored by sign) ----------

function ProfitChart({rows, fmt}){
  const data = rows.filter(r=>r.date).slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-30);
  if (data.length < 2) {
    return <div style={{padding:'20px 12px',textAlign:'center',color:T.textFaint,fontFamily:fontBody,fontSize:13}}>Nedostatek dat pro graf – přidej aspoň 2 dny.</div>;
  }
  const W = 600, H = 170, padX = 6;
  const values = data.map(r=>r.profit);
  const maxVal = Math.max(0, ...values);
  const minVal = Math.min(0, ...values);
  const range = (maxVal - minVal) || 1;
  const baselineY = H - ((0-minVal)/range)*H;
  const n = data.length;
  const slot = (W - padX*2) / n;
  const barW = Math.max(2, slot*0.55);
  return (<svg viewBox={'0 0 '+W+' '+H} style={{width:'100%',height:170,display:'block'}} preserveAspectRatio="none">
    <line x1={0} y1={baselineY} x2={W} y2={baselineY} stroke={T.borderSoft} strokeWidth="1" />
    {data.map((r,i)=>{
      const val = r.profit;
      const y = H - ((val-minVal)/range)*H;
      const barTop = val>=0 ? y : baselineY;
      const barH = Math.max(1, Math.abs(y-baselineY));
      const x = padX + i*slot + (slot-barW)/2;
      return (<rect key={i} x={x} y={barTop} width={barW} height={barH} rx={Math.min(3,barW/3)} fill={val>=0?T.positive:T.negative} opacity={0.9}>
        <title>{r.date+' — '+fmt(val)}</title>
      </rect>);
    })}
  </svg>);
}

// ---------- SHARED: weekly / monthly profit summary ----------

function weekStartKey(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = (d.getDay()+6)%7;
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
function fmtDateCz(iso){ const parts = iso.split('-'); return parts[2]+'.'+parts[1]+'.'; }

function PeriodSummary({rows, fmt}){
  const [period, setPeriod] = useState('week');
  const grouped = useMemo(()=>{
    const map = {};
    rows.filter(r=>r.date).forEach(r=>{
      const key = period==='week' ? weekStartKey(r.date) : r.date.slice(0,7);
      map[key] = (map[key]||0) + r.profit;
    });
    return Object.entries(map).sort((a,b)=> b[0].localeCompare(a[0])).slice(0,8);
  },[rows,period]);
  const maxAbs = Math.max(1, ...grouped.map(([,v])=>Math.abs(v)));
  return (<div>
    <div style={{display:'flex',gap:6,marginBottom:12}}>
      <button onClick={()=>setPeriod('week')} style={{background:period==='week'?T.surfaceAlt:'transparent',border:'1px solid '+T.border,borderRadius:6,color:period==='week'?T.text:T.textFaint,fontFamily:fontBody,fontSize:12,padding:'5px 10px',cursor:'pointer'}}>Týdny</button>
      <button onClick={()=>setPeriod('month')} style={{background:period==='month'?T.surfaceAlt:'transparent',border:'1px solid '+T.border,borderRadius:6,color:period==='month'?T.text:T.textFaint,fontFamily:fontBody,fontSize:12,padding:'5px 10px',cursor:'pointer'}}>Měsíce</button>
    </div>
    {grouped.length===0 && <div style={{color:T.textFaint,fontSize:13,fontFamily:fontBody,padding:'8px 0'}}>Zatím žádná data.</div>}
    {grouped.map(([key,val])=>(
      <div key={key} style={{position:'relative',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px',borderBottom:'1px solid '+T.borderSoft,overflow:'hidden',borderRadius:6}}>
        <div style={{position:'absolute',left:0,top:0,bottom:0,width:(Math.abs(val)/maxAbs*100)+'%',background:val>=0?T.positive:T.negative,opacity:0.14}} />
        <span style={{position:'relative',fontFamily:fontBody,fontSize:13,color:T.textMuted}}>{period==='week' ? ('Týden od '+fmtDateCz(key)) : key}</span>
        <span style={{position:'relative',fontFamily:fontMono,fontSize:13,fontWeight:600,color:val>=0?T.positive:T.negative}}>{fmt(val)}</span>
      </div>
    ))}
  </div>);
}

// ---------- META TAB (CZK) ----------

function MetaTab({data, setData}){
  const {settings, rows} = data;
  const beroas = useMemo(()=>{ const price=toNum(settings.price), fc=toNum(settings.fulfillCost), of=toNum(settings.otherFees); const net = price - fc - of; return net>0 ? price/net : 0; },[settings]);
  const computedRows = useMemo(()=>rows.map(r=>{
    const units=toNum(r.units), adSpend=toNum(r.adSpend), price=toNum(settings.price), fc=toNum(settings.fulfillCost), of=toNum(settings.otherFees);
    const revenue = units*price;
    const fulfill = units*(fc+of);
    const profit = revenue - fulfill - adSpend;
    const roas = adSpend>0 ? revenue/adSpend : 0;
    return {...r, revenue, fulfill, profit, roas, adSpendNum:adSpend, unitsNum:units};
  }),[rows,settings]);
  const totals = useMemo(()=>{
    const totalProfit = computedRows.reduce((s,r)=>s+r.profit,0);
    const totalRevenue = computedRows.reduce((s,r)=>s+r.revenue,0);
    const totalSpend = computedRows.reduce((s,r)=>s+r.adSpendNum,0);
    const activeDays = computedRows.filter(r=>r.adSpendNum>0||r.unitsNum>0).length;
    return { totalProfit, totalRevenue, totalSpend,
      blendedRoas: totalSpend>0?totalRevenue/totalSpend:0,
      marginPct: totalRevenue>0?(totalProfit/totalRevenue)*100:0,
      avgDaily: activeDays>0?totalProfit/activeDays:0 };
  },[computedRows]);
  const maxAbsProfit = Math.max(1, ...computedRows.map(r=>Math.abs(r.profit)));
  const [showChart, setShowChart] = useState(false);
  const [showPeriod, setShowPeriod] = useState(false);
  const updateSettings=(k,v)=>setData(d=>({...d,settings:{...d.settings,[k]:v}}));
  const updateRow=(id,k,v)=>setData(d=>({...d,rows:d.rows.map(r=>r.id===id?{...r,[k]:v}:r)}));
  const addRow=()=>setData(d=>({...d,rows:[...d.rows,{id:uid(),date:todayISO(),units:'0',adSpend:'0'}]}));
  const deleteRow=(id)=>setData(d=>({...d,rows:d.rows.filter(r=>r.id!==id)}));

  const cw = { date:'20%', units:'8%', adSpend:'12%', revenue:'14%', fulfill:'14%', profit:'14%', roas:'12%', del:'6%' };

  return (<div>
    <div style={{background:T.surface,border:'1px solid '+T.border,borderRadius:10,padding:'16px 18px',marginBottom:18}}>
      <div style={{fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,marginBottom:12}}>Ekonomika produktu</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:14}}>
        <Field label="Cena produktu (Kč)"><input {...numInputProps} style={inputStyle} value={settings.price} onChange={e=>updateSettings('price',e.target.value)} /></Field>
        <Field label="Fulfill náklady (Kč)"><input {...numInputProps} style={inputStyle} value={settings.fulfillCost} onChange={e=>updateSettings('fulfillCost',e.target.value)} /></Field>
        <Field label="Ostatní poplatky (Kč)"><input {...numInputProps} style={inputStyle} value={settings.otherFees} onChange={e=>updateSettings('otherFees',e.target.value)} /></Field>
        <Field label="BEROAS"><div style={{...inputStyle,background:'transparent',border:'1px solid '+T.borderSoft,color:T.paprika,fontWeight:600}}>{beroas.toFixed(2)}</div></Field>
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12,marginBottom:18}}>
      <MetricCard label="Total profit" value={fmtKc(totals.totalProfit)} tone={totals.totalProfit>=0?'positive':'negative'} />
      <MetricCard label="Total revenue" value={fmtKc(totals.totalRevenue)} />
      <MetricCard label="Total ad spend" value={fmtKc(totals.totalSpend)} />
      <MetricCard label="Blended ROAS" value={totals.blendedRoas.toFixed(2)} sub={"Break-even: "+beroas.toFixed(2)} tone={totals.blendedRoas>=beroas?'positive':'negative'} />
      <MetricCard label="Profit margin" value={fmtPct(totals.marginPct)} />
      <MetricCard label="Ø denní profit" value={fmtKc(totals.avgDaily)} tone={totals.avgDaily>=0?'positive':'negative'} />
    </div>

    <div style={{display:'flex',gap:8,marginBottom:showChart||showPeriod?12:18}}>
      <ToolbarToggle label="Graf" icon={<IconChart/>} active={showChart} onClick={()=>setShowChart(v=>!v)} accent={T.meta} />
      <ToolbarToggle label="Přehled" icon={<IconCalendar/>} active={showPeriod} onClick={()=>setShowPeriod(v=>!v)} accent={T.meta} />
    </div>
    {showChart && <div style={{background:T.surface,border:'1px solid '+T.border,borderRadius:10,padding:'16px 18px',marginBottom:18}}><ProfitChart rows={computedRows} fmt={fmtKc} /></div>}
    {showPeriod && <div style={{background:T.surface,border:'1px solid '+T.border,borderRadius:10,padding:'16px 18px',marginBottom:18}}><PeriodSummary rows={computedRows} fmt={fmtKc} /></div>}

    <div style={{overflowX:'auto',border:'1px solid '+T.border,borderRadius:10}}>
      <table style={{width:'100%',borderCollapse:'collapse',minWidth:640,tableLayout:'fixed'}}>
        <thead><tr style={{background:T.surface}}>
          <th style={{width:cw.date,textAlign:'left',padding:'10px 12px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border}}>Datum</th>
          <th style={{width:cw.units,textAlign:'right',padding:'10px 12px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border}}>Ks</th>
          <th style={{width:cw.adSpend,textAlign:'right',padding:'10px 12px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border}}>Ad spend</th>
          <th style={{width:cw.revenue,textAlign:'right',padding:'10px 12px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border}}>Revenue</th>
          <th style={{width:cw.fulfill,textAlign:'right',padding:'10px 12px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border}}>Fulfill</th>
          <th style={{width:cw.profit,textAlign:'right',padding:'10px 12px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border}}>Profit</th>
          <th style={{width:cw.roas,textAlign:'right',padding:'10px 12px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border}}>ROAS</th>
          <th style={{width:cw.del,borderBottom:'1px solid '+T.border}}></th>
        </tr></thead>
        <tbody>
          {computedRows.length===0 && <tr><td colSpan={8} style={{padding:'28px 12px',textAlign:'center',color:T.textFaint,fontFamily:fontBody,fontSize:13}}>Zatím žádná data. Přidej první den.</td></tr>}
          {computedRows.map((r,i)=>(
            <tr key={r.id}>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft}}><input type="date" style={inputStyle} value={r.date} onChange={e=>updateRow(r.id,'date',e.target.value)} /></td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft}}><input {...numInputProps} style={{...inputStyle,textAlign:'right'}} value={r.units} onChange={e=>updateRow(r.id,'units',e.target.value)} /></td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft}}><input {...numInputProps} style={{...inputStyle,textAlign:'right'}} value={r.adSpend} onChange={e=>updateRow(r.id,'adSpend',e.target.value)} /></td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,color:T.textMuted}}>{fmtKc(r.revenue)}</td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,color:T.textMuted}}>{fmtKc(r.fulfill)}</td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',position:'relative'}}>
                <DataBar value={r.profit} max={maxAbsProfit} positive={r.profit>=0} />
                <span style={{position:'relative',fontFamily:fontMono,fontSize:13,fontWeight:600,color:r.profit>=0?T.positive:T.negative}}>{fmtKc(r.profit)}</span>
              </td>

// ---------- PINTEREST TAB (EUR) ----------

function PinterestTab({data, setData}){
  const {settings, rows} = data;
  const computedRows = useMemo(()=>rows.map(r=>{
    const spend=toNum(r.spend), conversions=toNum(r.conversions), orderValue=toNum(r.orderValue), margin=toNum(settings.margin);
    const cpa = conversions>0 ? spend/conversions : 0;
    const roas = spend>0 ? orderValue/spend : 0;
    const profit = orderValue*(margin/100) - spend;
    const profitPct = spend>0 ? (profit/spend)*100 : 0;
    return {...r, spendNum:spend, cpa, roas, profit, profitPct};
  }),[rows,settings]);
  const totals = useMemo(()=>{
    const totalSpend = computedRows.reduce((s,r)=>s+r.spendNum,0);
    const totalOrderValue = computedRows.reduce((s,r)=>s+toNum(r.orderValue),0);
    const totalProfit = computedRows.reduce((s,r)=>s+r.profit,0);
    const totalConversions = computedRows.reduce((s,r)=>s+toNum(r.conversions),0);
    const activeDays = computedRows.filter(r=>r.spendNum>0).length;
    return { totalSpend, totalOrderValue, totalProfit, totalConversions,
      blendedRoas: totalSpend>0?totalOrderValue/totalSpend:0,
      avgDaily: activeDays>0?totalProfit/activeDays:0 };
  },[computedRows]);
  const maxAbsProfit = Math.max(1, ...computedRows.map(r=>Math.abs(r.profit)));
  const [showChart, setShowChart] = useState(false);
  const [showPeriod, setShowPeriod] = useState(false);
  const updateSettings=(k,v)=>setData(d=>({...d,settings:{...d.settings,[k]:v}}));
  const updateRow=(id,k,v)=>setData(d=>({...d,rows:d.rows.map(r=>r.id===id?{...r,[k]:v}:r)}));
  const addRow=()=>setData(d=>({...d,rows:[...d.rows,{id:uid(),date:todayISO(),spend:'0',conversions:'0',orderValue:'0'}]}));
  const deleteRow=(id)=>setData(d=>({...d,rows:d.rows.filter(r=>r.id!==id)}));
  const cols = [
    {key:'date',label:'Datum',w:'120px',isDate:true},
    {key:'spend',label:'Spend',w:'90px'},
    {key:'conversions',label:'Conv.',w:'80px'},
    {key:'orderValue',label:'Order value',w:'110px'},
  ];
  const calcCols = [
    {key:'cpa',label:'CPA',w:'90px'},
    {key:'roas',label:'ROAS',w:'80px'},
    {key:'profit',label:'Profit',w:'110px'},
    {key:'profitPct',label:'Profit %',w:'100px'},
  ];
  return (<div>
    <div style={{background:T.surface,border:'1px solid '+T.border,borderRadius:10,padding:'16px 18px',marginBottom:18}}>
      <div style={{fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,marginBottom:12}}>Nastavení</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:14,maxWidth:300}}>
        <Field label="Průměrná marže (%)"><input {...numInputProps} style={inputStyle} value={settings.margin} onChange={e=>updateSettings('margin',e.target.value)} /></Field>
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12,marginBottom:18}}>
      <MetricCard label="Total profit" value={fmtEur(totals.totalProfit)} tone={totals.totalProfit>=0?'positive':'negative'} />
      <MetricCard label="Total order value" value={fmtEur(totals.totalOrderValue)} />
      <MetricCard label="Total spend" value={fmtEur(totals.totalSpend)} />
      <MetricCard label="Blended ROAS" value={totals.blendedRoas.toFixed(2)} />
      <MetricCard label="Konverze" value={fmtNum(totals.totalConversions)} />
      <MetricCard label="Ø denní profit" value={fmtEur(totals.avgDaily)} tone={totals.avgDaily>=0?'positive':'negative'} />
    </div>

    <div style={{display:'flex',gap:8,marginBottom:showChart||showPeriod?12:18}}>
      <ToolbarToggle label="Graf" icon={<IconChart/>} active={showChart} onClick={()=>setShowChart(v=>!v)} accent={T.pin} />
      <ToolbarToggle label="Přehled" icon={<IconCalendar/>} active={showPeriod} onClick={()=>setShowPeriod(v=>!v)} accent={T.pin} />
    </div>
    {showChart && <div style={{background:T.surface,border:'1px solid '+T.border,borderRadius:10,padding:'16px 18px',marginBottom:18}}><ProfitChart rows={computedRows} fmt={fmtEur} /></div>}
    {showPeriod && <div style={{background:T.surface,border:'1px solid '+T.border,borderRadius:10,padding:'16px 18px',marginBottom:18}}><PeriodSummary rows={computedRows} fmt={fmtEur} /></div>}

    <div style={{overflowX:'auto',border:'1px solid '+T.border,borderRadius:10}}>
      <table style={{borderCollapse:'collapse',tableLayout:'fixed',width:'max-content',minWidth:'100%'}}>
        <thead><tr style={{background:T.surface}}>
          {cols.map((c,i)=>(<th key={c.key} style={{width:c.w,textAlign:i===0?'left':'right',padding:'10px 10px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border,whiteSpace:'nowrap'}}>{c.label}</th>))}
          {calcCols.map(c=>(<th key={c.key} style={{width:c.w,textAlign:'right',padding:'10px 10px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border,whiteSpace:'nowrap'}}>{c.label}</th>))}
          <th style={{width:'46px',borderBottom:'1px solid '+T.border}}></th>
        </tr></thead>
        <tbody>
          {computedRows.length===0 && <tr><td colSpan={cols.length+calcCols.length+1} style={{padding:'28px 12px',textAlign:'center',color:T.textFaint,fontFamily:fontBody,fontSize:13}}>Zatím žádná data. Přidej první den.</td></tr>}
          {computedRows.map((r,i)=>(
            <tr key={r.id}>

                <td key={c.key} style={{padding:'6px 10px',borderBottom:'1px solid '+T.borderSoft}}>
                  {c.isDate

                    : <input {...numInputProps} style={{...inputStyle,textAlign:'right'}} value={r[c.key]} onChange={e=>updateRow(r.id,c.key,e.target.value)} />}
                </td>
              ))}
              <td style={{padding:'6px 10px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,color:T.textMuted}}>{fmtEur(r.cpa)}</td>
              <td style={{padding:'6px 10px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,color:r.roas>=1.5?T.positive:T.textMuted}}>{r.roas.toFixed(2)}</td>
              <td style={{padding:'6px 10px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',position:'relative'}}>
                <DataBar value={r.profit} max={maxAbsProfit} positive={r.profit>=0} />
                <span style={{position:'relative',fontFamily:fontMono,fontSize:13,fontWeight:600,color:r.profit>=0?T.positive:T.negative}}>{fmtEur(r.profit)}</span>
              </td>
              <td style={{padding:'6px 10px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,color:r.profitPct>=0?T.positive:T.negative}}>{fmtPct(r.profitPct)}</td>
              <td style={{padding:'6px 10px',borderBottom:'1px solid '+T.borderSoft,textAlign:'center'}}><IconBtn onClick={()=>deleteRow(r.id)} title="Smazat řádek" danger>✕</IconBtn></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
    <div style={{marginTop:14}}><AddBtn onClick={addRow} label="Přidat den" accent={T.pin} /></div>
  </div>);
}

// ---------- INVOICES TAB (PDF uploads, stored per device in IndexedDB) ----------

function InvoicesTab({storeId}){
  const [invoices, setInvoices] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [pendingFile, setPendingFile] = useState(null);
  const [amount, setAmount] = useState('');
  const [date, setDate] = useState(todayISO());
  const [error, setError] = useState('');
  const fileInputRef = useRef(null);

  const reload = async () => {
    const all = await idbGetAll();
    setInvoices(all.filter(r=>r.storeId===storeId).sort((a,b)=> b.date.localeCompare(a.date)));
  };
  useEffect(()=>{ reload().then(()=>setLoaded(true)); },[storeId]);

  const handleAdd = async () => {
    if (!pendingFile) { setError('Nejdřív vyber PDF soubor.'); return; }
    if (toNum(amount) <= 0) { setError('Zadej částku faktury.'); return; }
    setError('');
    const record = {
      id: uid(), storeId, fileName: pendingFile.name, fileType: pendingFile.type,
      size: pendingFile.size, amount: toNum(amount), date, blob: pendingFile,
    };
    await idbAdd(record);
    setPendingFile(null); setAmount(''); setDate(todayISO());
    if (fileInputRef.current) fileInputRef.current.value = '';
    reload();
  };
  const handleDelete = async (id) => { await idbDelete(id); reload(); };
  const handleView = (record) => {
    const url = URL.createObjectURL(record.blob);
    window.open(url, '_blank');
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  };

  const totals = useMemo(()=>{
    const now = new Date();
    const yearStr = String(now.getFullYear());
    const monthStr = yearStr+'-'+String(now.getMonth()+1).padStart(2,'0');
    const totalYear = invoices.filter(r=>r.date.startsWith(yearStr)).reduce((s,r)=>s+r.amount,0);
    const totalMonth = invoices.filter(r=>r.date.startsWith(monthStr)).reduce((s,r)=>s+r.amount,0);
    const totalAll = invoices.reduce((s,r)=>s+r.amount,0);
    const byMonth = {};
    invoices.forEach(r=>{ const m = r.date.slice(0,7); byMonth[m] = (byMonth[m]||0) + r.amount; });
    const monthRows = Object.entries(byMonth).sort((a,b)=> b[0].localeCompare(a[0]));
    return { totalYear, totalMonth, totalAll, count: invoices.length, monthRows };
  },[invoices]);

  return (<div>
    <div style={{background:T.surface,border:'1px solid '+T.border,borderRadius:10,padding:'16px 18px',marginBottom:18}}>
      <div style={{fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,marginBottom:12}}>Přidat fakturu</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:14,alignItems:'end'}}>
        <Field label="PDF soubor">
          <input ref={fileInputRef} type="file" accept="application/pdf" style={{...inputStyle,padding:'5px 8px'}} onChange={e=>setPendingFile(e.target.files[0]||null)} />
        </Field>
        <Field label="Datum"><input type="date" style={inputStyle} value={date} onChange={e=>setDate(e.target.value)} /></Field>
        <Field label="Částka (Kč)"><input {...numInputProps} style={inputStyle} placeholder="0" value={amount} onChange={e=>setAmount(e.target.value)} /></Field>
        <button onClick={handleAdd} style={{background:T.invoice,border:'none',borderRadius:8,color:'#12141A',fontFamily:fontDisplay,fontWeight:600,fontSize:13,padding:'9px 16px',cursor:'pointer',height:36}}>Přidat fakturu</button>
      </div>
      {error && <div style={{color:T.negative,fontSize:13,marginTop:10,fontFamily:fontBody}}>{error}</div>}
      {pendingFile && !error && <div style={{color:T.textMuted,fontSize:12,marginTop:10,fontFamily:fontBody}}>Vybráno: {pendingFile.name}</div>}
    </div>

    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12,marginBottom:18}}>
      <MetricCard label="Celkem tento měsíc" value={fmtKc(totals.totalMonth)} />
      <MetricCard label="Celkem tento rok" value={fmtKc(totals.totalYear)} />
      <MetricCard label="Celkem vše" value={fmtKc(totals.totalAll)} />
      <MetricCard label="Počet faktur" value={fmtNum(totals.count)} />
    </div>

    {totals.monthRows.length > 0 && (
      <div style={{overflowX:'auto',border:'1px solid '+T.border,borderRadius:10,marginBottom:18}}>
        <table style={{width:'100%',borderCollapse:'collapse',tableLayout:'fixed'}}>
          <thead><tr style={{background:T.surface}}>
            <th style={{width:'50%',textAlign:'left',padding:'10px 12px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border}}>Měsíc</th>
            <th style={{width:'50%',textAlign:'right',padding:'10px 12px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border}}>Celkem</th>
          </tr></thead>
          <tbody>
            {totals.monthRows.map(([m,total])=>(
              <tr key={m}>
                <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft,fontFamily:fontMono,fontSize:13,color:T.textMuted}}>{m}</td>
                <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,fontWeight:600,color:T.text}}>{fmtKc(total)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    )}

    <div style={{overflowX:'auto',border:'1px solid '+T.border,borderRadius:10}}>
      <table style={{width:'100%',borderCollapse:'collapse',tableLayout:'fixed',minWidth:520}}>
        <thead><tr style={{background:T.surface}}>
          <th style={{width:'18%',textAlign:'left',padding:'10px 12px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border}}>Datum</th>
          <th style={{width:'42%',textAlign:'left',padding:'10px 12px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border}}>Soubor</th>
          <th style={{width:'22%',textAlign:'right',padding:'10px 12px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border}}>Částka</th>
          <th style={{width:'18%',borderBottom:'1px solid '+T.border}}></th>
        </tr></thead>
        <tbody>
          {loaded && invoices.length===0 && <tr><td colSpan={4} style={{padding:'28px 12px',textAlign:'center',color:T.textFaint,fontFamily:fontBody,fontSize:13}}>Zatím žádné faktury. Přidej první výše.</td></tr>}
          {invoices.map((r,i)=>(
            <tr key={r.id}>
              <td style={{padding:'8px 12px',borderBottom:'1px solid '+T.borderSoft,fontFamily:fontMono,fontSize:13,color:T.textMuted}}>{r.date}</td>
              <td style={{padding:'8px 12px',borderBottom:'1px solid '+T.borderSoft,fontFamily:fontBody,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                <button onClick={()=>handleView(r)} style={{background:'transparent',border:'none',color:T.invoice,cursor:'pointer',fontFamily:fontBody,fontSize:13,padding:0,textDecoration:'underline',maxWidth:'100%',overflow:'hidden',textOverflow:'ellipsis'}}>{r.fileName}</button>
              </td>
              <td style={{padding:'8px 12px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,fontWeight:600}}>{fmtKc(r.amount)}</td>
              <td style={{padding:'8px 12px',borderBottom:'1px solid '+T.borderSoft,textAlign:'center'}}><IconBtn onClick={()=>handleDelete(r.id)} title="Smazat fakturu" danger>✕</IconBtn></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  </div>);
}

        {stores.map(s=>(
          <div key={s.id} style={{display:'flex',alignItems:'center',gap:8}}>
            <button onClick={()=>onSelect(s.id)} style={{flex:1,textAlign:'left',background:T.surface,border:'1px solid '+T.border,borderRadius:10,padding:'14px 16px',color:T.text,fontFamily:fontDisplay,fontWeight:600,fontSize:15,cursor:'pointer'}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=T.paprika;}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;}}>
              {s.name}
            </button>
            <IconBtn onClick={()=>onDelete(s.id)} title="Smazat obchod" danger>✕</IconBtn>
          </div>
        ))}
        {loaded && stores.length===0 && <div style={{color:T.textFaint,fontSize:13,textAlign:'center',padding:'12px 0'}}>Zatím žádný obchod. Přidej první níže.</div>}
        {!loaded && !connError && <div style={{color:T.textFaint,fontSize:13,textAlign:'center',padding:'12px 0'}}>Načítám obchody…</div>}
      </div>

      <div style={{display:'flex',gap:8}}>
        <input style={{...inputStyle,fontFamily:fontBody}} type="text" placeholder="Název obchodu, např. Manos Cálida" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter' && name.trim()){ onCreate(name.trim()); setName(''); } }} />
        <button onClick={()=>{ if(name.trim()){ onCreate(name.trim()); setName(''); } }} style={{background:T.paprika,border:'none',borderRadius:8,color:'#12141A',fontFamily:fontDisplay,fontWeight:600,fontSize:13,padding:'0 18px',cursor:'pointer'}}>Přidat</button>
      </div>
    </div>
  </div>);
}

// ---------- WORKSPACE (per-store) ----------

const DEFAULT_META = { settings: { price: '999', fulfillCost: '300', otherFees: '20' }, rows: [] };
const DEFAULT_PIN = { settings: { margin: '62' }, rows: [] };
const DEFAULT_ORDERS = { settings: { kurzEur: '24.2', kurzUsd: '21' }, rows: [] };

function Workspace({storeId, storeName, onBack}){
  const [tab, setTab] = useState('meta');
  const [metaData, setMetaData] = useState(DEFAULT_META);
  const [pinData, setPinData] = useState(DEFAULT_PIN);
  const [ordersData, setOrdersData] = useState(DEFAULT_ORDERS);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState('idle');
  const saveTimer = useRef(null);

  useEffect(()=>{
    setLoaded(false);
    const unsub = watchStoreData(storeId, (data)=>{
      if (data.meta) setMetaData(data.meta);
      if (data.pinterest) setPinData(data.pinterest);
      if (data.orders) setOrdersData(data.orders);
      setLoaded(true);
    }, ()=>setSaveState('error'));
    return unsub;
  },[storeId]);

  useEffect(()=>{
    if (!loaded) return;
    setSaveState('saving');
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(()=>{
      Promise.all([
        updateStoreField(storeId,'meta',metaData),
        updateStoreField(storeId,'pinterest',pinData),
        updateStoreField(storeId,'orders',ordersData),
      ]).then(()=>setSaveState('saved')).catch(()=>setSaveState('error'));
    }, 500);
    return ()=>clearTimeout(saveTimer.current);
  },[metaData, pinData, ordersData, loaded, storeId]);

  const tabs = [
    {id:'meta', label:'META ADS', color:T.meta, dim:T.metaDim},
    {id:'pinterest', label:'PINTEREST ADS', color:T.pin, dim:T.pinDim},
    {id:'orders', label:'OBJEDNÁVKY', color:T.orders, dim:T.ordersDim},
    {id:'invoices', label:'FAKTURY', color:T.invoice, dim:T.invoiceDim},
  ];

  return (<div style={{background:T.bg,minHeight:'100vh',padding:'28px 16px 60px',fontFamily:fontBody,color:T.text}}>
    <div style={{maxWidth:1200,margin:'0 auto'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
        <div>
          <button onClick={onBack} style={{background:'transparent',border:'none',color:T.textFaint,fontFamily:fontBody,fontSize:12,cursor:'pointer',padding:0,marginBottom:8,display:'flex',alignItems:'center',gap:4}}>← Obchody</button>
          <div style={{fontFamily:fontDisplay,fontWeight:700,fontSize:28,letterSpacing:'-0.02em',color:T.text}}>{storeName}</div>
          <div style={{fontSize:12,color:T.textFaint,marginTop:3,letterSpacing:'0.04em',textTransform:'uppercase'}}>Profitomat · Denní přehled výkonu kampaní</div>
        </div>
        <div style={{fontSize:11,color:T.textFaint,fontFamily:fontMono}}>
          {saveState==='saving'?'synchronizuji…':saveState==='saved'?'synchronizováno v cloudu':saveState==='error'?'chyba připojení':''}
        </div>
      </div>
      <div style={{display:'flex',gap:4,marginBottom:22,background:T.surface,border:'1px solid '+T.border,borderRadius:10,padding:4,width:'fit-content',flexWrap:'wrap'}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 16px',borderRadius:7,border:'none',cursor:'pointer',background:tab===t.id?t.dim:'transparent',color:tab===t.id?t.color:T.textMuted,fontFamily:fontDisplay,fontWeight:600,fontSize:13}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:t.color}} /> {t.label}
          </button>
        ))}
      </div>
      {tab==='meta' && <MetaTab data={metaData} setData={setMetaData} />}
      {tab==='pinterest' && <PinterestTab data={pinData} setData={setPinData} />}
      {tab==='orders' && <OrdersTab data={ordersData} setData={setOrdersData} />}
      {tab==='invoices' && <InvoicesTab storeId={storeId} />}
    </div>
  </div>);
}

// ---------- APP ----------

function App(){
  const [stores, setStores] = useState([]);
  const [storesLoaded, setStoresLoaded] = useState(false);
  const [connError, setConnError] = useState(false);
  const [currentStoreId, setCurrentStoreId] = useState(null);

  useEffect(()=>{
    const unsub = watchStores(
      (list)=>{ setStores(list); setStoresLoaded(true); setConnError(false); },
      ()=>{ setConnError(true); }
    );
    return unsub;
  },[]);

  const handleCreate = (name) => {
    const id = uid();
    createStoreDoc(id, name).catch(()=>setConnError(true));
  };
  const handleDelete = (id) => {
    deleteStoreDoc(id).catch(()=>setConnError(true));
    idbGetAll().then(all => { all.filter(r=>r.storeId===id).forEach(r => idbDelete(r.id)); });
    if (currentStoreId===id) setCurrentStoreId(null);
  };

  if (!currentStoreId) {
    return <StorePicker stores={stores} loaded={storesLoaded} connError={connError} onSelect={setCurrentStoreId} onCreate={handleCreate} onDelete={handleDelete} />;
  }
  const store = stores.find(s=>s.id===currentStoreId);
  return <Workspace key={currentStoreId} storeId={currentStoreId} storeName={store ? store.name : ''} onBack={()=>setCurrentStoreId(null)} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
