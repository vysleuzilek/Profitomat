<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Profitomat</title>
<meta name="theme-color" content="#12141A" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Profitomat" />
<style>
  html, body { margin: 0; padding: 0; background: #12141A; }
  * { box-sizing: border-box; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const T = {
  bg: '#12141A', surface: '#191C24', surfaceAlt: '#1F232D',
  border: '#2A2E3A', borderSoft: '#22252F', text: '#EDEFF3',
  textMuted: '#8B90A0', textFaint: '#5C616F',
  positive: '#3ED9A0', negative: '#FF6B6E',
  meta: '#7C8CFF', metaDim: 'rgba(124,140,255,0.14)',
  pin: '#E0245E', pinDim: 'rgba(224,36,94,0.14)',
  orders: '#3ED9A0', ordersDim: 'rgba(62,217,160,0.14)',
  paprika: '#E8622C',
};
const fontDisplay = "'Space Grotesk','Segoe UI',system-ui,sans-serif";
const fontBody = "'Inter','Segoe UI',system-ui,sans-serif";
const fontMono = "'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace";

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function fmtEur(n,d=2){ if(!isFinite(n)) n=0; const s=Math.abs(n).toLocaleString('cs-CZ',{minimumFractionDigits:d,maximumFractionDigits:d}); return (n<0?'-':'')+'€'+s; }
function fmtKc(n,d=2){ if(!isFinite(n)) n=0; const s=n.toLocaleString('cs-CZ',{minimumFractionDigits:d,maximumFractionDigits:d}); return s+' Kč'; }
function fmtPct(n,d=1){ if(!isFinite(n)) n=0; return n.toLocaleString('cs-CZ',{minimumFractionDigits:d,maximumFractionDigits:d})+'%'; }
function fmtNum(n,d=0){ if(!isFinite(n)) n=0; return n.toLocaleString('cs-CZ',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

const storage = {
  get(key){ try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch(e){ return false; } },
  remove(key){ try { localStorage.removeItem(key); } catch(e){} }
};

const inputStyle = { background: T.surfaceAlt, border: '1px solid '+T.border, borderRadius: 6, color: T.text, fontFamily: fontMono, fontSize: 13, padding: '6px 8px', outline: 'none', width: '100%' };

function Field({label, children}){
  return (<div style={{display:'flex',flexDirection:'column',gap:4}}>
    <span style={{fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint}}>{label}</span>
    {children}
  </div>);
}
function MetricCard({label, value, sub, tone}){
  const color = tone==='positive'?T.positive:tone==='negative'?T.negative:T.text;
  return (<div style={{background:T.surface,border:'1px solid '+T.border,borderRadius:10,padding:'14px 16px',minWidth:0}}>
    <div style={{fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,marginBottom:6}}>{label}</div>
    <div style={{fontFamily:fontMono,fontSize:22,fontWeight:600,color,lineHeight:1.1}}>{value}</div>
    {sub && <div style={{fontFamily:fontBody,fontSize:12,color:T.textMuted,marginTop:4}}>{sub}</div>}
  </div>);
}
function DataBar({value, max, positive}){
  const pct = max>0 ? Math.min(100,(Math.abs(value)/max)*100) : 0;
  const color = positive ? T.positive : T.negative;
  return (<div style={{position:'absolute',left:0,top:0,bottom:0,right:0,pointerEvents:'none',overflow:'hidden',borderRadius:4}}>
    <div style={{position:'absolute',left:0,top:0,bottom:0,width:pct+'%',background:color,opacity:0.16}} />
  </div>);
}
function IconBtn({onClick, children, title, danger}){
  return (<button onClick={onClick} title={title} style={{background:'transparent',border:'none',color:danger?T.textFaint:T.textMuted,cursor:'pointer',padding:6,borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center'}}
    onMouseEnter={e=>{e.currentTarget.style.color=danger?T.negative:T.text;e.currentTarget.style.background=T.surfaceAlt;}}
    onMouseLeave={e=>{e.currentTarget.style.color=danger?T.textFaint:T.textMuted;e.currentTarget.style.background='transparent';}}>
    {children}
  </button>);
}
function AddBtn({onClick, label, accent}){
  return (<button onClick={onClick} style={{display:'flex',alignItems:'center',gap:6,background:'transparent',border:'1px dashed '+T.border,borderRadius:8,color:T.textMuted,fontFamily:fontBody,fontSize:13,padding:'9px 14px',cursor:'pointer'}}
    onMouseEnter={e=>{e.currentTarget.style.borderColor=accent;e.currentTarget.style.color=T.text;}}
    onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.color=T.textMuted;}}>
    + {label}
  </button>);
}

// ---------- META TAB (CZK) ----------

function MetaTab({data, setData}){
  const {settings, rows} = data;
  const beroas = useMemo(()=>{ const net = settings.price - settings.fulfillCost - settings.otherFees; return net>0 ? settings.price/net : 0; },[settings]);
  const computedRows = useMemo(()=>rows.map(r=>{
    const revenue = r.units*settings.price;
    const fulfill = r.units*(settings.fulfillCost+settings.otherFees);
    const profit = revenue - fulfill - r.adSpend;
    const roas = r.adSpend>0 ? revenue/r.adSpend : 0;
    return {...r, revenue, fulfill, profit, roas};
  }),[rows,settings]);
  const totals = useMemo(()=>{
    const totalProfit = computedRows.reduce((s,r)=>s+r.profit,0);
    const totalRevenue = computedRows.reduce((s,r)=>s+r.revenue,0);
    const totalSpend = computedRows.reduce((s,r)=>s+r.adSpend,0);
    const activeDays = computedRows.filter(r=>r.adSpend>0||r.units>0).length;
    return { totalProfit, totalRevenue, totalSpend,
      blendedRoas: totalSpend>0?totalRevenue/totalSpend:0,
      marginPct: totalRevenue>0?(totalProfit/totalRevenue)*100:0,
      avgDaily: activeDays>0?totalProfit/activeDays:0 };
  },[computedRows]);
  const maxAbsProfit = Math.max(1, ...computedRows.map(r=>Math.abs(r.profit)));
  const updateSettings=(k,v)=>setData(d=>({...d,settings:{...d.settings,[k]:v}}));
  const updateRow=(id,k,v)=>setData(d=>({...d,rows:d.rows.map(r=>r.id===id?{...r,[k]:v}:r)}));
  const addRow=()=>setData(d=>({...d,rows:[...d.rows,{id:uid(),date:todayISO(),units:0,adSpend:0}]}));
  const deleteRow=(id)=>setData(d=>({...d,rows:d.rows.filter(r=>r.id!==id)}));

  return (<div>
    <div style={{background:T.surface,border:'1px solid '+T.border,borderRadius:10,padding:'16px 18px',marginBottom:18}}>
      <div style={{fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,marginBottom:12}}>Ekonomika produktu</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:14}}>
        <Field label="Cena produktu (Kč)"><input style={inputStyle} type="number" step="1" value={settings.price} onChange={e=>updateSettings('price',parseFloat(e.target.value)||0)} /></Field>
        <Field label="Fulfill náklady (Kč)"><input style={inputStyle} type="number" step="1" value={settings.fulfillCost} onChange={e=>updateSettings('fulfillCost',parseFloat(e.target.value)||0)} /></Field>
        <Field label="Ostatní poplatky (Kč)"><input style={inputStyle} type="number" step="1" value={settings.otherFees} onChange={e=>updateSettings('otherFees',parseFloat(e.target.value)||0)} /></Field>
        <Field label="BEROAS"><div style={{...inputStyle,background:'transparent',border:'1px solid '+T.borderSoft,color:T.paprika,fontWeight:600}}>{beroas.toFixed(2)}</div></Field>
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12,marginBottom:18}}>
      <MetricCard label="Total profit" value={fmtKc(totals.totalProfit)} tone={totals.totalProfit>=0?'positive':'negative'} />
      <MetricCard label="Total revenue" value={fmtKc(totals.totalRevenue)} />
      <MetricCard label="Total ad spend" value={fmtKc(totals.totalSpend)} />
      <MetricCard label="Blended ROAS" value={totals.blendedRoas.toFixed(2)} sub={"Break-even: "+beroas.toFixed(2)} tone={totals.blendedRoas>=beroas?'positive':'negative'} />
      <MetricCard label="Profit margin" value={fmtPct(totals.marginPct)} />
      <MetricCard label="Ø denní profit" value={fmtKc(totals.avgDaily)} tone={totals.avgDaily>=0?'positive':'negative'} />
    </div>
    <div style={{overflowX:'auto',border:'1px solid '+T.border,borderRadius:10}}>
      <table style={{width:'100%',borderCollapse:'collapse',minWidth:640}}>
        <thead><tr style={{background:T.surface}}>
          {['Datum','Ks','Ad spend','Revenue','Fulfill','Profit','ROAS',''].map((h,i)=>(
            <th key={i} style={{textAlign:i===0?'left':'right',padding:'10px 12px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border,whiteSpace:'nowrap'}}>{h}</th>
          ))}
        </tr></thead>
        <tbody>
          {computedRows.length===0 && <tr><td colSpan={8} style={{padding:'28px 12px',textAlign:'center',color:T.textFaint,fontFamily:fontBody,fontSize:13}}>Zatím žádná data. Přidej první den.</td></tr>}
          {computedRows.map((r,i)=>(
            <tr key={r.id} style={{background:i%2===1?T.surfaceAlt:'transparent'}}>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft}}><input type="date" style={{...inputStyle,width:130}} value={r.date} onChange={e=>updateRow(r.id,'date',e.target.value)} /></td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft}}><input type="number" style={{...inputStyle,width:60,textAlign:'right'}} value={r.units} onChange={e=>updateRow(r.id,'units',parseFloat(e.target.value)||0)} /></td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft}}><input type="number" step="1" style={{...inputStyle,width:80,textAlign:'right'}} value={r.adSpend} onChange={e=>updateRow(r.id,'adSpend',parseFloat(e.target.value)||0)} /></td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,color:T.textMuted}}>{fmtKc(r.revenue)}</td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,color:T.textMuted}}>{fmtKc(r.fulfill)}</td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',position:'relative'}}>
                <DataBar value={r.profit} max={maxAbsProfit} positive={r.profit>=0} />
                <span style={{position:'relative',fontFamily:fontMono,fontSize:13,fontWeight:600,color:r.profit>=0?T.positive:T.negative}}>{fmtKc(r.profit)}</span>
              </td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,color:r.roas>=beroas?T.positive:T.textMuted}}>{r.roas.toFixed(2)}</td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right'}}><IconBtn onClick={()=>deleteRow(r.id)} title="Smazat řádek" danger>✕</IconBtn></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
    <div style={{marginTop:14}}><AddBtn onClick={addRow} label="Přidat den" accent={T.meta} /></div>
  </div>);
}

// ---------- PINTEREST TAB (EUR) ----------

function PinterestTab({data, setData}){
  const {settings, rows} = data;
  const computedRows = useMemo(()=>rows.map(r=>{
    const cpa = r.conversions>0 ? r.spend/r.conversions : 0;
    const roas = r.spend>0 ? r.orderValue/r.spend : 0;
    const convRate = r.outboundClicks>0 ? (r.conversions/r.outboundClicks)*100 : 0;
    const cpc = r.pinClicks>0 ? r.spend/r.pinClicks : 0;
    const ctr = r.impressions>0 ? (r.pinClicks/r.impressions)*100 : 0;
    const profit = r.orderValue*(settings.margin/100) - r.spend;
    const profitPct = r.spend>0 ? (profit/r.spend)*100 : 0;
    return {...r, cpa, roas, convRate, cpc, ctr, profit, profitPct};
  }),[rows,settings]);
  const totals = useMemo(()=>{
    const totalSpend = computedRows.reduce((s,r)=>s+r.spend,0);
    const totalOrderValue = computedRows.reduce((s,r)=>s+r.orderValue,0);
    const totalProfit = computedRows.reduce((s,r)=>s+r.profit,0);
    const totalConversions = computedRows.reduce((s,r)=>s+r.conversions,0);
    const activeDays = computedRows.filter(r=>r.spend>0).length;
    return { totalSpend, totalOrderValue, totalProfit, totalConversions,
      blendedRoas: totalSpend>0?totalOrderValue/totalSpend:0,
      avgDaily: activeDays>0?totalProfit/activeDays:0 };
  },[computedRows]);
  const maxAbsProfit = Math.max(1, ...computedRows.map(r=>Math.abs(r.profit)));
  const updateSettings=(k,v)=>setData(d=>({...d,settings:{...d.settings,[k]:v}}));
  const updateRow=(id,k,v)=>setData(d=>({...d,rows:d.rows.map(r=>r.id===id?{...r,[k]:v}:r)}));
  const addRow=()=>setData(d=>({...d,rows:[...d.rows,{id:uid(),date:todayISO(),spend:0,impressions:0,pinClicks:0,outboundClicks:0,conversions:0,orderValue:0}]}));
  const deleteRow=(id)=>setData(d=>({...d,rows:d.rows.filter(r=>r.id!==id)}));
  const cols = [
    {key:'date',label:'Datum',type:'date',w:130},
    {key:'spend',label:'Spend',type:'number',step:'0.01',w:70},
    {key:'impressions',label:'Impr.',type:'number',w:70},
    {key:'pinClicks',label:'Pin clicks',type:'number',w:70},
    {key:'outboundClicks',label:'Outb. clicks',type:'number',w:80},
    {key:'conversions',label:'Conv.',type:'number',w:60},
    {key:'orderValue',label:'Order value',type:'number',step:'0.01',w:90},
  ];
  return (<div>
    <div style={{background:T.surface,border:'1px solid '+T.border,borderRadius:10,padding:'16px 18px',marginBottom:18}}>
      <div style={{fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,marginBottom:12}}>Nastavení</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:14,maxWidth:300}}>
        <Field label="Průměrná marže (%)"><input style={inputStyle} type="number" step="0.1" value={settings.margin} onChange={e=>updateSettings('margin',parseFloat(e.target.value)||0)} /></Field>
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12,marginBottom:18}}>
      <MetricCard label="Total profit" value={fmtEur(totals.totalProfit)} tone={totals.totalProfit>=0?'positive':'negative'} />
      <MetricCard label="Total order value" value={fmtEur(totals.totalOrderValue)} />
      <MetricCard label="Total spend" value={fmtEur(totals.totalSpend)} />
      <MetricCard label="Blended ROAS" value={totals.blendedRoas.toFixed(2)} />
      <MetricCard label="Konverze" value={fmtNum(totals.totalConversions)} />
      <MetricCard label="Ø denní profit" value={fmtEur(totals.avgDaily)} tone={totals.avgDaily>=0?'positive':'negative'} />
    </div>
    <div style={{overflowX:'auto',border:'1px solid '+T.border,borderRadius:10}}>
      <table style={{width:'100%',borderCollapse:'collapse',minWidth:1080}}>
        <thead><tr style={{background:T.surface}}>
          {[...cols.map(c=>c.label),'CPA','ROAS','Conv. rate','CPC','CTR','Profit','Profit %',''].map((h,i)=>(
            <th key={i} style={{textAlign:i===0?'left':'right',padding:'10px 10px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border,whiteSpace:'nowrap'}}>{h}</th>
          ))}
        </tr></thead>
        <tbody>
          {computedRows.length===0 && <tr><td colSpan={cols.length+7} style={{padding:'28px 12px',textAlign:'center',color:T.textFaint,fontFamily:fontBody,fontSize:13}}>Zatím žádná data. Přidej první den.</td></tr>}
          {computedRows.map((r,i)=>(
            <tr key={r.id} style={{background:i%2===1?T.surfaceAlt:'transparent'}}>
              {cols.map(c=>(
                <td key={c.key} style={{padding:'6px 10px',borderBottom:'1px solid '+T.borderSoft}}>
                  <input type={c.type} step={c.step} style={{...inputStyle,width:c.w,textAlign:c.type==='number'?'right':'left'}} value={r[c.key]} onChange={e=>updateRow(r.id,c.key,c.type==='number'?(parseFloat(e.target.value)||0):e.target.value)} />
                </td>
              ))}
              <td style={{padding:'6px 10px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,color:T.textMuted}}>{fmtEur(r.cpa)}</td>
              <td style={{padding:'6px 10px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,color:r.roas>=1.5?T.positive:T.textMuted}}>{r.roas.toFixed(2)}</td>
              <td style={{padding:'6px 10px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,color:T.textMuted}}>{fmtPct(r.convRate)}</td>
              <td style={{padding:'6px 10px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,color:T.textMuted}}>{fmtEur(r.cpc)}</td>
              <td style={{padding:'6px 10px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,color:T.textMuted}}>{fmtPct(r.ctr)}</td>
              <td style={{padding:'6px 10px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',position:'relative'}}>
                <DataBar value={r.profit} max={maxAbsProfit} positive={r.profit>=0} />
                <span style={{position:'relative',fontFamily:fontMono,fontSize:13,fontWeight:600,color:r.profit>=0?T.positive:T.negative}}>{fmtEur(r.profit)}</span>
              </td>
              <td style={{padding:'6px 10px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',fontFamily:fontMono,fontSize:13,color:r.profitPct>=0?T.positive:T.negative}}>{fmtPct(r.profitPct)}</td>
              <td style={{padding:'6px 10px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right'}}><IconBtn onClick={()=>deleteRow(r.id)} title="Smazat řádek" danger>✕</IconBtn></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
    <div style={{marginTop:14}}><AddBtn onClick={addRow} label="Přidat den" accent={T.pin} /></div>
  </div>);
}

// ---------- ORDERS TAB (per-order profit calculator, Kč) ----------

function OrdersTab({data, setData}){
  const {settings, rows} = data;
  const computedRows = useMemo(()=>rows.map(r=>{
    const result = r.earnedEur*settings.kurzEur - r.paidUsd*settings.kurzUsd;
    return {...r, result};
  }),[rows,settings]);
  const totals = useMemo(()=>{
    const totalResult = computedRows.reduce((s,r)=>s+r.result,0);
    const totalPaid = computedRows.reduce((s,r)=>s+r.paidUsd,0);
    const totalEarned = computedRows.reduce((s,r)=>s+r.earnedEur,0);
    return { totalResult, totalPaid, totalEarned, count: computedRows.length };
  },[computedRows]);
  const maxAbsResult = Math.max(1, ...computedRows.map(r=>Math.abs(r.result)));
  const updateSettings=(k,v)=>setData(d=>({...d,settings:{...d.settings,[k]:v}}));
  const updateRow=(id,k,v)=>setData(d=>({...d,rows:d.rows.map(r=>r.id===id?{...r,[k]:v}:r)}));
  const addRow=()=>setData(d=>({...d,rows:[...d.rows,{id:uid(),orderNumber:'#'+(1000+d.rows.length+1),paidUsd:0,earnedEur:0}]}));
  const deleteRow=(id)=>setData(d=>({...d,rows:d.rows.filter(r=>r.id!==id)}));

  return (<div>
    <div style={{background:T.surface,border:'1px solid '+T.border,borderRadius:10,padding:'16px 18px',marginBottom:18}}>
      <div style={{fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,marginBottom:12}}>Kurzy</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:14,maxWidth:400}}>
        <Field label="Kurz EUR → CZK"><input style={inputStyle} type="number" step="0.01" value={settings.kurzEur} onChange={e=>updateSettings('kurzEur',parseFloat(e.target.value)||0)} /></Field>
        <Field label="Kurz USD → CZK"><input style={inputStyle} type="number" step="0.01" value={settings.kurzUsd} onChange={e=>updateSettings('kurzUsd',parseFloat(e.target.value)||0)} /></Field>
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12,marginBottom:18}}>
      <MetricCard label="Celkový výsledek" value={fmtKc(totals.totalResult)} tone={totals.totalResult>=0?'positive':'negative'} />
      <MetricCard label="Celkem vyděláno (EUR)" value={fmtEur(totals.totalEarned)} />
      <MetricCard label="Celkem zaplaceno (USD)" value={'$'+fmtNum(totals.totalPaid,2)} />
      <MetricCard label="Počet objednávek" value={fmtNum(totals.count)} />
    </div>
    <div style={{overflowX:'auto',border:'1px solid '+T.border,borderRadius:10}}>
      <table style={{width:'100%',borderCollapse:'collapse',minWidth:640}}>
        <thead><tr style={{background:T.surface}}>
          {['Objednávka','Zaplaceno (nákup, $)','Vydělal (€)','Výsledek (Kč)',''].map((h,i)=>(
            <th key={i} style={{textAlign:i===0?'left':'right',padding:'10px 12px',fontFamily:fontBody,fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:T.textFaint,borderBottom:'1px solid '+T.border,whiteSpace:'nowrap'}}>{h}</th>
          ))}
        </tr></thead>
        <tbody>
          {computedRows.length===0 && <tr><td colSpan={5} style={{padding:'28px 12px',textAlign:'center',color:T.textFaint,fontFamily:fontBody,fontSize:13}}>Zatím žádné objednávky. Přidej první.</td></tr>}
          {computedRows.map((r,i)=>(
            <tr key={r.id} style={{background:i%2===1?T.surfaceAlt:'transparent'}}>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft}}><input type="text" style={{...inputStyle,width:90}} value={r.orderNumber} onChange={e=>updateRow(r.id,'orderNumber',e.target.value)} /></td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft}}><input type="number" step="0.01" style={{...inputStyle,width:100,textAlign:'right'}} value={r.paidUsd} onChange={e=>updateRow(r.id,'paidUsd',parseFloat(e.target.value)||0)} /></td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft}}><input type="number" step="0.01" style={{...inputStyle,width:100,textAlign:'right'}} value={r.earnedEur} onChange={e=>updateRow(r.id,'earnedEur',parseFloat(e.target.value)||0)} /></td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right',position:'relative'}}>
                <DataBar value={r.result} max={maxAbsResult} positive={r.result>=0} />
                <span style={{position:'relative',fontFamily:fontMono,fontSize:13,fontWeight:600,color:r.result>=0?T.positive:T.negative}}>{fmtKc(r.result)}</span>
              </td>
              <td style={{padding:'6px 12px',borderBottom:'1px solid '+T.borderSoft,textAlign:'right'}}><IconBtn onClick={()=>deleteRow(r.id)} title="Smazat řádek" danger>✕</IconBtn></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
    <div style={{marginTop:14}}><AddBtn onClick={addRow} label="Přidat objednávku" accent={T.orders} /></div>
  </div>);
}

// ---------- STORE PICKER ----------

function StorePicker({stores, onSelect, onCreate, onDelete}){
  const [name, setName] = useState('');
  return (<div style={{background:T.bg,minHeight:'100vh',padding:'60px 20px',fontFamily:fontBody,color:T.text}}>
    <div style={{maxWidth:520,margin:'0 auto'}}>
      <div style={{fontFamily:fontDisplay,fontWeight:700,fontSize:28,letterSpacing:'-0.02em',marginBottom:6,textAlign:'center'}}>PROFITOMAT</div>
      <div style={{fontSize:13,color:T.textMuted,marginBottom:36,textAlign:'center'}}>Vyber obchod, který chceš sledovat</div>

      <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:28}}>
        {stores.map(s=>(
          <div key={s.id} style={{display:'flex',alignItems:'center',gap:8}}>
            <button onClick={()=>onSelect(s.id)} style={{flex:1,textAlign:'left',background:T.surface,border:'1px solid '+T.border,borderRadius:10,padding:'14px 16px',color:T.text,fontFamily:fontDisplay,fontWeight:600,fontSize:15,cursor:'pointer'}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=T.paprika;}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;}}>
              {s.name}
            </button>
            <IconBtn onClick={()=>onDelete(s.id)} title="Smazat obchod" danger>✕</IconBtn>
          </div>
        ))}
        {stores.length===0 && <div style={{color:T.textFaint,fontSize:13,textAlign:'center',padding:'12px 0'}}>Zatím žádný obchod. Přidej první níže.</div>}
      </div>

      <div style={{display:'flex',gap:8}}>
        <input style={{...inputStyle,fontFamily:fontBody}} type="text" placeholder="Název obchodu, např. Manos Cálida" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter' && name.trim()){ onCreate(name.trim()); setName(''); } }} />
        <button onClick={()=>{ if(name.trim()){ onCreate(name.trim()); setName(''); } }} style={{background:T.paprika,border:'none',borderRadius:8,color:'#12141A',fontFamily:fontDisplay,fontWeight:600,fontSize:13,padding:'0 18px',cursor:'pointer'}}>Přidat</button>
      </div>
    </div>
  </div>);
}

// ---------- WORKSPACE (per-store) ----------

const DEFAULT_META = { settings: { price: 999, fulfillCost: 300, otherFees: 20 }, rows: [] };
const DEFAULT_PIN = { settings: { margin: 62 }, rows: [] };
const DEFAULT_ORDERS = { settings: { kurzEur: 24.2, kurzUsd: 21 }, rows: [] };

function Workspace({storeId, storeName, onBack}){
  const [tab, setTab] = useState('meta');
  const [metaData, setMetaData] = useState(()=> storage.get('store:'+storeId+':meta') || DEFAULT_META);
  const [pinData, setPinData] = useState(()=> storage.get('store:'+storeId+':pinterest') || DEFAULT_PIN);
  const [ordersData, setOrdersData] = useState(()=> storage.get('store:'+storeId+':orders') || DEFAULT_ORDERS);
  const [saveState, setSaveState] = useState('idle');
  const saveTimer = useRef(null);

  useEffect(()=>{
    setSaveState('saving');
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(()=>{
      const ok1 = storage.set('store:'+storeId+':meta', metaData);
      const ok2 = storage.set('store:'+storeId+':pinterest', pinData);
      const ok3 = storage.set('store:'+storeId+':orders', ordersData);
      setSaveState(ok1 && ok2 && ok3 ? 'saved' : 'error');
    }, 400);
    return ()=>clearTimeout(saveTimer.current);
  },[metaData, pinData, ordersData, storeId]);

  const tabs = [
    {id:'meta', label:'META ADS', color:T.meta, dim:T.metaDim},
    {id:'pinterest', label:'PINTEREST ADS', color:T.pin, dim:T.pinDim},
    {id:'orders', label:'OBJEDNÁVKY', color:T.orders, dim:T.ordersDim},
  ];

  return (<div style={{background:T.bg,minHeight:'100vh',padding:'28px 16px 60px',fontFamily:fontBody,color:T.text}}>
    <div style={{maxWidth:1200,margin:'0 auto'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:24,flexWrap:'wrap',gap:12}}>
        <div>
          <button onClick={onBack} style={{background:'transparent',border:'none',color:T.textFaint,fontFamily:fontBody,fontSize:12,cursor:'pointer',padding:0,marginBottom:6}}>← Obchody</button>
          <div style={{fontFamily:fontDisplay,fontWeight:700,fontSize:26,letterSpacing:'-0.02em'}}>PROFITOMAT</div>
          <div style={{fontSize:13,color:T.textMuted,marginTop:2}}>Denní přehled výkonu kampaní · {storeName}</div>
        </div>
        <div style={{fontSize:11,color:T.textFaint,fontFamily:fontMono}}>
          {saveState==='saving'?'ukládám…':saveState==='saved'?'uloženo v tomto zařízení':saveState==='error'?'chyba ukládání':''}
        </div>
      </div>
      <div style={{display:'flex',gap:4,marginBottom:22,background:T.surface,border:'1px solid '+T.border,borderRadius:10,padding:4,width:'fit-content',flexWrap:'wrap'}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 16px',borderRadius:7,border:'none',cursor:'pointer',background:tab===t.id?t.dim:'transparent',color:tab===t.id?t.color:T.textMuted,fontFamily:fontDisplay,fontWeight:600,fontSize:13}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:t.color}} /> {t.label}
          </button>
        ))}
      </div>
      {tab==='meta' && <MetaTab data={metaData} setData={setMetaData} />}
      {tab==='pinterest' && <PinterestTab data={pinData} setData={setPinData} />}
      {tab==='orders' && <OrdersTab data={ordersData} setData={setOrdersData} />}
    </div>
  </div>);
}

// ---------- APP ----------

function App(){
  const [stores, setStores] = useState(()=> storage.get('stores:list') || []);
  const [currentStoreId, setCurrentStoreId] = useState(null);

  const persistStores = (list) => { setStores(list); storage.set('stores:list', list); };
  const handleCreate = (name) => {
    const s = { id: uid(), name };
    persistStores([...stores, s]);
  };
  const handleDelete = (id) => {
    persistStores(stores.filter(s=>s.id!==id));
    storage.remove('store:'+id+':meta');
    storage.remove('store:'+id+':pinterest');
    storage.remove('store:'+id+':orders');
    if (currentStoreId===id) setCurrentStoreId(null);
  };

  if (!currentStoreId) {
    return <StorePicker stores={stores} onSelect={setCurrentStoreId} onCreate={handleCreate} onDelete={handleDelete} />;
  }
  const store = stores.find(s=>s.id===currentStoreId);
  return <Workspace key={currentStoreId} storeId={currentStoreId} storeName={store ? store.name : ''} onBack={()=>setCurrentStoreId(null)} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
